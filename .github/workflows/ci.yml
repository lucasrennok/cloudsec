name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  quality:
    name: Lint, testes e cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Checar formatacao
        run: npm run format:check
      - name: Testes com cobertura
        run: npm run coverage
      - name: Publicar relatorio de cobertura
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage/

  sast-semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Semgrep
        run: semgrep scan --config auto --error

  sast-codeql:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6 # v3
        with:
          languages: javascript
      - uses: github/codeql-action/analyze@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6 # v3
  
  dast-zap:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build da imagem
        run: docker build -t cloudsec:ci .
      - name: Subir o container
        run: |
          docker run -d --name cloudsec -p 8080:8080 cloudsec:ci
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8080/ >/dev/null; then break; fi
            sleep 2
          done
      - name: Permissao de escrita para o ZAP
        run: chmod -R a+w "$GITHUB_WORKSPACE"
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        continue-on-error: true
        with:
          target: http://localhost:8080
          fail_action: false
          allow_issue_writing: false
      - name: Publicar relatorio do ZAP
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zap-report
          path: |
            report_html.html
            report_json.json
            report_md.md