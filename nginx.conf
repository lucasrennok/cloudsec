server {
    # Porta não privilegiada (>1024) para poder rodar como usuário não-root.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Cabeçalhos de segurança ----
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ---- Isolamento de origem (mitiga ataques de canal lateral) ----
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # ---- Cache ----
    # Conteúdo pequeno e sem dados sensíveis; não armazenar mantém o scan limpo.
    add_header Cache-Control "no-store" always;

    # Esconde a versão do NGINX nas respostas.
    server_tokens off;

    # ---- Compressão ----
    gzip on;
    gzip_types text/css application/javascript;

    location / {
        try_files $uri $uri/ =404;
    }

    # Bloqueia arquivos ocultos (ex.: .git, .env) por precaução.
    location ~ /\. {
        deny all;
    }
}
