server {
    # Porta não privilegiada (>1024) para poder rodar como usuário não-root.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Cabeçalhos de segurança ----
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Esconde a versão do NGINX nas respostas.
    server_tokens off;

    # ---- Compressão ----
    gzip on;
    gzip_types text/css application/javascript text/html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Bloqueia arquivos ocultos (ex.: .git, .env) por precaução.
    location ~ /\. {
        deny all;
    }
}
